services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: job_search
      POSTGRES_USER: job_search
      POSTGRES_PASSWORD: job_search
    ports:
      - "${JOB_SEARCH_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_search -d job_search"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - job_search_pgdata:/var/lib/postgresql/data

volumes:
  job_search_pgdata:
