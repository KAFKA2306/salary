<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Job Search</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="./">JOB SEARCH</a>
  <div class="header-rule">基本給800万円以上 / 顧客伴走なし</div>
</header>

<main>
  <section class="intro">
    <p class="kicker">あなた向け求人</p>
    <h1>条件を通った求人だけ表示</h1>
    <p>固定残業を除く基本給・自社側の仕事・AI/データ基盤への近さで求人単位に判定。</p>
  </section>

  <section class="summary" aria-label="サマリー">
    <div><strong id="eligible-count">—</strong><span>通過</span></div>
    <div><strong id="top-salary">—</strong><span>最高基本給下限</span></div>
    <div><strong id="remote-count">—</strong><span>リモート可</span></div>
    <div><strong id="rejected-count">—</strong><span>条件落ち</span></div>
  </section>

  <section class="toolbar">
    <h2>求人</h2>
    <div class="filters" role="group" aria-label="求人フィルター">
      <button class="filter active" data-filter="all">すべて</button>
      <button class="filter" data-filter="remote">リモート</button>
      <button class="filter" data-filter="platform">データ基盤</button>
      <button class="filter" data-filter="ai">AI</button>
    </div>
  </section>

  <section id="job-list" class="job-list" aria-live="polite">
    <p class="state">読み込み中…</p>
  </section>

  <section class="rejected">
    <div class="toolbar">
      <div>
        <p class="kicker">除外</p>
        <h2>条件落ち</h2>
      </div>
    </div>
    <div id="rejected-list" class="rejected-list"></div>
  </section>

  <footer>
    <span>Ontology + dbt + Airflow</span>
    <a href="./archive.html">旧給与調査</a>
  </footer>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
