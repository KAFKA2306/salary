name: Archive integrity

on:
  pull_request:
    paths:
      - "archive-manifest.json"
      - "data/official_compensation/**"
      - "scripts/archive_integrity.py"
      - "scripts/browser_archive_inspection.py"
      - "scripts/browser_compensation_benchmark.py"
      - "tests/test_archive_integrity.py"
      - "tests/test_archive_web.py"
      - "web/archive.html"
      - "web/archive-app.mjs"
      - ".github/workflows/archive-integrity.yml"
  push:
    branches: [main]
    paths:
      - "archive-manifest.json"
      - "data/official_compensation/**"
      - "scripts/archive_integrity.py"
      - "scripts/browser_archive_inspection.py"
      - "scripts/browser_compensation_benchmark.py"
      - "tests/test_archive_integrity.py"
      - "tests/test_archive_web.py"
      - "web/archive.html"
      - "web/archive-app.mjs"
      - ".github/workflows/archive-integrity.yml"
  workflow_dispatch:

jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run archive tests
        run: python -m unittest tests.test_archive_integrity tests.test_archive_web -v
      - name: Generate machine-readable audit report
        run: python scripts/archive_integrity.py --report archive-report.json
