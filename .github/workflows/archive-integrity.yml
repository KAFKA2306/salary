name: Archive integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile auditor
        run: python -m py_compile scripts/archive_integrity.py tests/test_archive_integrity.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate machine-readable audit report
        run: python scripts/archive_integrity.py --report archive-report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: archive-integrity-report
          path: archive-report.json
          if-no-files-found: error
