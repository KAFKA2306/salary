name: Archive integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile auditors
        run: python -m py_compile scripts/archive_integrity.py scripts/browser_archive_inspection.py tests/test_archive_integrity.py tests/test_archive_web.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Probe official EDINET corporate identities
        run: |
          python - <<'PY'
          import csv, io, json, pathlib, urllib.request, zipfile
          source = "https://disclosure2dl.edinet-fsa.go.jp/searchdocument/codelist/Edinetcode.zip"
          with urllib.request.urlopen(source, timeout=30) as response:
              payload = response.read()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              csv_name = next(name for name in archive.namelist() if name.lower().endswith(".csv"))
              text = archive.read(csv_name).decode("cp932")
          lines = text.splitlines()
          header_index = next(i for i, line in enumerate(lines) if "ＥＤＩＮＥＴコード" in line and "提出者法人番号" in line)
          rows = list(csv.DictReader(io.StringIO("\n".join(lines[header_index:]))))
          by_edinet = {(row.get("ＥＤＩＮＥＴコード") or "").strip(): row for row in rows}
          cohort = json.loads(pathlib.Path("data/official_compensation/transport-equipment-fy2026-salary-top20.json").read_text(encoding="utf-8"))
          matches = []
          for observation in cohort["observations"]:
              code = observation["edinet_code"]
              row = by_edinet.get(code)
              if row is None:
                  raise SystemExit(f"missing EDINET code: {code}")
              corporate_number = (row.get("提出者法人番号") or "").strip()
              if len(corporate_number) != 13 or not corporate_number.isdigit():
                  raise SystemExit(f"invalid corporate number for {code}: {corporate_number!r}")
              securities_code = (row.get("証券コード") or "").strip()
              if securities_code and not securities_code.startswith(observation["securities_code"]):
                  raise SystemExit(f"securities code mismatch for {code}: {securities_code!r}")
              matches.append({"edinet_code": code, "company_name": observation["company_name"], "corporate_number": corporate_number, "edinet_securities_code": securities_code})
          print("BULK_IDENTITY_EVIDENCE=" + json.dumps({"source_url":source,"source_metadata":lines[0],"matched_count":len(matches),"matches":matches}, ensure_ascii=False,separators=(",", ":")))
          if len(matches) != 20:
              raise SystemExit(f"expected 20 matches, got {len(matches)}")
          PY
      - name: Generate machine-readable audit report
        run: python scripts/archive_integrity.py --report archive-report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: archive-integrity-report
          path: archive-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify clean checkout
        run: |
          rm -f archive-report.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=all)"

  static-site-build:
    needs: audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and test static archive site
        run: |
          mkdir -p dist/artifacts
          cp web/index.html web/app.mjs web/worker.mjs web/styles.css dist/
          cp scripts/browser_archive_inspection.py dist/archive_inspection.py
          cp archive-manifest.json dist/
          cp data/official_compensation/transport-equipment-fy2026-salary-top20.json dist/
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('.')
          dist = root / 'dist' / 'artifacts'
          manifest = json.loads((root / 'archive-manifest.json').read_text(encoding='utf-8'))
          for item in manifest['artifacts']:
              path = pathlib.Path(item['path'])
              if path.suffix.lower() != '.csv': continue
              target = dist / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / path, target)
          PY
          python -m http.server 8765 --directory dist >/tmp/salary-static-site.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8765/archive-manifest.json') as r: manifest = json.load(r)
          assert manifest['archive_as_of'] == '2024-02'
          with urllib.request.urlopen('http://127.0.0.1:8765/transport-equipment-fy2026-salary-top20.json') as r: benchmark = json.load(r)
          assert len(benchmark['observations']) == 20
          assert benchmark['cohort_definition']['scope'] == '提出会社'
          with urllib.request.urlopen('http://127.0.0.1:8765/') as r: page = r.read().decode('utf-8')
          assert '輸送用機器・給与上位20社の報酬比較' in page
          assert '業界全体の代表標本ではありません' in page
          assert '2024年2月の研究snapshot' in page
          PY
      - name: Verify build residue can be removed cleanly
        run: |
          rm -rf dist
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=all)"
