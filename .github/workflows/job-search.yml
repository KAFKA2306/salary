name: Job search decision pipeline

on:
  pull_request:
    paths:
      - "seeds/**"
      - "evidence/**"
      - "models/**"
      - "ontology/**"
      - "config/dbt/**"
      - "scripts/validate_job_ontology.py"
      - "scripts/export_job_rankings.py"
      - "scripts/job_decision_trace.py"
      - "tests/test_job_decision_trace.py"
      - "dags/job_search_pipeline.py"
      - "web/job-dashboard.json"
      - ".github/workflows/job-search.yml"
  push:
    branches: [main]
    paths:
      - "seeds/**"
      - "evidence/**"
      - "models/**"
      - "ontology/**"
      - "config/dbt/**"
      - "scripts/validate_job_ontology.py"
      - "scripts/export_job_rankings.py"
      - "dags/job_search_pipeline.py"
      - "web/job-dashboard.json"
      - ".github/workflows/job-search.yml"
  workflow_dispatch:

jobs:
  decision-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOB_SEARCH_DB_HOST: localhost
      JOB_SEARCH_DB_PORT: "5432"
      JOB_SEARCH_DB_NAME: job_search
      JOB_SEARCH_DB_USER: job_search
      JOB_SEARCH_DB_PASSWORD: job_search
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: job_search
          POSTGRES_USER: job_search
          POSTGRES_PASSWORD: job_search
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_search -d job_search"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install decision-model dependencies
        run: python -m pip install "PyYAML>=6,<7" "dbt-core>=1.9,<2" "dbt-postgres>=1.9,<2" "psycopg[binary]>=3.2,<4"

      - name: Validate ontology
        run: python scripts/validate_job_ontology.py

      - name: Verify decision-trace safety rules
        run: python -m unittest discover -s tests -p "test_job_decision_trace.py" -v

      - name: Build dbt decision model
        run: |
          dbt seed --profiles-dir config/dbt
          dbt build --profiles-dir config/dbt

      - name: Export ranking
        run: python scripts/export_job_rankings.py

      - name: Assert hard gates and dashboard consistency
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          rows = list(csv.DictReader(Path("artifacts/job_ranking.csv").open(encoding="utf-8")))
          assert rows, "ranking must not be empty"
          assert all(int(r["base_salary_min_jpy"]) >= 8_000_000 for r in rows)

          generated = json.loads(Path("artifacts/job_dashboard.json").read_text(encoding="utf-8"))
          checked_in = json.loads(Path("web/job-dashboard.json").read_text(encoding="utf-8"))
          assert generated == checked_in, "web/job-dashboard.json is stale; regenerate from dbt"
          trace = json.loads(Path("artifacts/job_decision_trace.json").read_text(encoding="utf-8"))
          assert trace["summary"]["pass"] == len(rows)
          assert trace["summary"]["total"] == len(generated["eligible"]) + len(generated["rejected"])
          assert {r["job_id"] for r in trace["decisions"] if r["status"] == "PASS"} == {r["job_id"] for r in rows}
          assert all(r["source_url"] for r in trace["decisions"] if r["status"] == "PASS")
          assert all(r["action"] == "withhold_ranking" for r in trace["decisions"] if r["status"] != "PASS")
          PY

      - name: Retain decision lineage for review
        uses: actions/upload-artifact@v4
        with:
          name: job-decision-trace
          path: artifacts/job_decision_trace.json
          if-no-files-found: error
          retention-days: 30
